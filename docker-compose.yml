services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-fazendoemcasa}
      DB_USERNAME: ${DB_USERNAME:-fazendoemcasa}
      DB_PASSWORD: ${DB_PASSWORD:-fazendoemcasa}
      CMS_USE_DATABASE: ${CMS_USE_DATABASE:-1}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fazendoemcasa}
      MYSQL_USER: ${MYSQL_USER:-fazendoemcasa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fazendoemcasa}
    volumes:
      - fazendoemcasa_db:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fazendoemcasa_db:
