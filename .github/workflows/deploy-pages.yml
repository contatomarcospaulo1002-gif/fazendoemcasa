# Verifica o site após push na main (GitHub Pages já publica sozinho).

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  smoke:
    name: Aguardar Pages e testar URL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Esperar deploy do Pages
        run: sleep 90

      - name: GET fazendoemcasa.com
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/body.html -w "%{http_code}" -L --max-time 30 "https://fazendoemcasa.com/")
          echo "HTTP $code"
          test "$code" = "200"
          grep -qi "<title>" /tmp/body.html
