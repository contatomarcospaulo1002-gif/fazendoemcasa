<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Rascunho de página de venda para novo produto digital.">
  <title>Novo produto — página em preparação</title>
  <style>
    :root{color-scheme:light;--ink:#17352a;--muted:#607269;--paper:#f7f4ef;--line:#d8dfd8;--accent:#1f5c45;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
    main{max-width:960px;margin:0 auto;padding:clamp(32px,8vw,96px) 24px}.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
    h1{max-width:680px;margin:12px 0 18px;font:600 clamp(2.5rem,7vw,5.5rem)/.98 Georgia,serif;letter-spacing:-.04em}p{max-width:620px;color:var(--muted);font-size:1.08rem}
    .panel{margin-top:44px;padding:28px;background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px rgba(23,53,42,.06)}.panel strong{display:block;margin-bottom:8px}
    .cta{display:inline-block;margin-top:22px;padding:13px 20px;background:var(--accent);color:#fff;border-radius:8px;text-decoration:none;font-weight:700}.cta[aria-disabled=true]{opacity:.65}
    :focus-visible{outline:3px solid #d59b32;outline-offset:3px}
  </style>
  <script>window.PRODUCT_PAGE = { slug: "novo-produto" };</script>
</head>
<body>
<main>
  <div class="eyebrow">Página em preparação</div>
  <h1>Novo produto</h1>
  <p>Esta é a estrutura inicial da sua próxima oferta. Troque nome, texto, imagens e preço antes de publicar.</p>
  <section class="panel" aria-labelledby="offer-title">
    <strong id="offer-title">A oferta ainda não está configurada</strong>
    <span>Cadastre este produto no CMS e informe o checkout para ativar o botão de compra.</span>
    <br><a class="cta" data-checkout href="#checkout-pending-funil-b3" aria-disabled="true">Comprar</a>
  </section>
</main>
<script src="/product-runtime.js?v=20261118b"></script>
</body>
</html>
